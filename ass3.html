<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment</title>
</head>

<body>
    <div class="page">
        <div class="card">
            <img src="doraemon.jpg" alt="doremon">
            <p id="p">!! hello world !!</p>
            <button>click me</button>
        </div>
    </div>
</body>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    .card {
        height: 300px;
        width: 200px;
        background: white;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-self: auto;
        margin: 100px auto;

    }

    .card img {
        width: 100%;
        height: auto;
        border-radius: 16px;
        object-fit: cover;

        &:hover {
            transform: scale(1.05);
            transition: all 0.3s ease;
        }
    }

    #p {
        font-size: 30px;
        color: #333;
        text-align: center;
        margin: 0;
    }

    button {
        height: 50px;
        width: 100px;
        background: green;
        color: white;
        font-size: 20px;
        border-radius: 10px;
        border-color: black;
        border-width: 2px;
        border-style: solid;
    }
</style>

</html>
